<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboral-EC | Calculadora de Jubilación</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Estilos rápidos para asegurar la visualización */
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 500px; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-calcular { background-color: #27ae60; color: white; }
        .btn-calcular:hover { background-color: #219150; }
        .btn-pdf { background-color: #3498db; color: white; margin-top: 10px; }
        .resultado-caja { margin-top: 20px; padding: 15px; border-radius: 5px; display: none; }
        .error { background-color: #fadbd8; color: #a94442; border: 1px solid #ebccd1; display: block; }
        .exito { background-color: #d4efdf; color: #1e8449; border: 1px solid #c3e6cb; display: block; }
    </style>
</head>
<body>

    <div class="container">
        <h2>2. Jubilación Patronal</h2>
        
        <form id="formJubilacion">
            <label for="promedio">Promedio Sueldo últimos 5 años:</label>
            <input type="number" id="promedio" step="0.01" placeholder="Ej: 1554" required>

            <label for="añosServicio">Años de Servicio Continuo:</label>
            <input type="number" id="añosServicio" placeholder="Mínimo 25 años" required>

            <label for="edad">Edad del Trabajador:</label>
            <input type="number" id="edad" placeholder="Ej: 65" required>

            <button type="button" class="btn-calcular" onclick="procesarJubilacion()">CALCULAR PENSIÓN</button>
            <button type="button" class="btn-pdf">
                <i class="icon-file-pdf"></i> GUARDAR COMO PDF
            </button>
        </form>

        <div id="resultado" class="resultado-caja"></div>
    </div>

    <script src="js/normativa.js"></script>
    <script src="js/calculos.js"></script>

    <script>
        // Esta función vive aquí para conectar el botón con tus archivos .js externos
        function procesarJubilacion() {
            const visor = document.getElementById('resultado');
            
            // Llamamos a la función que está en js/calculos.js
            // Pasamos los valores para que el archivo JS los procese con seguridad
            if (typeof calcularPensionReal === "function") {
                calcularPensionReal();
            } else {
                // Fallback por si los archivos JS externos no han cargado aún
                const p = document.getElementById('promedio').value;
                const a = document.getElementById('añosServicio').value;
                const e = document.getElementById('edad').value;

                if (!p || !a || !e || isNaN(p) || isNaN(a) || isNaN(e)) {
                    visor.className = "resultado-caja error";
                    visor.innerHTML = "<strong>Seguridad:</strong> No se pueden procesar letras o campos vacíos.";
                } else {
                    // Cálculo rápido usando el nuevo SBU de 482
                    const sbu = 482; 
                    visor.className = "resultado-caja exito";
                    visor.innerHTML = "Calculando con SBU $" + sbu + "... (Revisa la consola)";
                    console.log("Datos listos para procesar con normativa 2026");
                }
            }
        }
    </script>
</body>
</html>
