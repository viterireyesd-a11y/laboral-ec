<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaboralEc | Consultoría y Legislación Ecuador 2026</title>
    <meta name="description" content="Calculadora laboral ecuatoriana: Liquidaciones, Jubilación Patronal y Décimos por meses.">
    <style>
        :root { --p: #002d5a; --s: #fd7e14; --g: #28a745; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); margin: 0; color: #333; }
        
        header { background: var(--p); color: white; padding: 40px 20px; text-align: center; border-bottom: 8px solid var(--s); }
        header h1 { margin: 0; font-size: 50px; font-weight: 900; }
        header h1 span { color: var(--s); }

        nav { display: flex; background: #222; position: sticky; top: 0; z-index: 1000; overflow-x: auto; }
        nav button { flex: 1; padding: 18px; border: none; background: none; color: white; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 12px; min-width: 120px; transition: 0.3s; }
        nav button.active { background: var(--s); }
        nav button:hover { background: #444; }

        .container { max-width: 900px; margin: 20px auto; background: white; min-height: 60vh; padding: 30px; box-shadow: 0 0 20px rgba(0,0,0,0.1); border-radius: 12px; }
        
        .section { display: none; animation: fadeIn 0.3s; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: #fff; border: 1px solid #ddd; padding: 25px; border-radius: 12px; border-left: 8px solid var(--p); margin-bottom: 20px; }
        h3 { color: var(--p); margin-top: 0; font-size: 24px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        label { font-weight: bold; display: block; margin-top: 15px; font-size: 14px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
        
        .btn { background: var(--p); color: white; width: 100%; padding: 15px; border: none; border-radius: 6px; font-size: 17px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #001a35; transform: translateY(-2px); }
        
        .res { margin-top: 20px; padding: 20px; background: #e8f5e9; border-left: 8px solid var(--g); border-radius: 6px; display: none; font-size: 18px; line-height: 1.6; }

        .info-container { display: flex; flex-wrap: wrap; gap: 20px; padding: 40px 20px; justify-content: center; background: #f0f0f0; border-top: 2px solid #ddd; }
        .info-column { flex: 1; min-width: 300px; max-width: 450px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-top: 5px solid var(--s); }
        .news-list { list-style: none; padding: 0; }
        .news-list li { margin-bottom: 15px; border-bottom: 1px dashed #ddd; padding-bottom: 10px; }
        .news-list .date { color: var(--s); font-weight: bold; font-size: 12px; display: block; }
        .news-list a { text-decoration: none; color: #333; font-size: 14px; font-weight: 500; }
        
        footer { background: #222; color: white; text-align: center; padding: 30px; font-size: 14px; }
    </style>
</head>
<body>

<header>
    <h1>Laboral<span>Ec</span></h1>
    <p>Portal Jurídico de Cálculos Laborales 2026</p>
</header>

<nav id="mainNav">
    <button class="tab-btn active" onclick="navegar(event, 'liq')">Liquidación</button>
    <button class="tab-btn" onclick="navegar(event, 'dec')">Décimos (Meses)</button>
    <button class="tab-btn" onclick="navegar(event, 'jub')">Jubilación Patronal</button>
    <button class="tab-btn" onclick="navegar(event, 'extras')">Horas Extras</button>
</nav>

<div class="container">
    <div id="liq" class="section active">
        <h3>Liquidación de Haberes</h3>
        <div class="card">
            <label>Tipo de Trámite:</label>
            <select id="l_motivo">
                <option value="desahucio">Desahucio (Art. 185)</option>
                <option value="despido">Despido Intempestivo (Art. 188)</option>
            </select>
            <label>Sueldo Mensual ($):</label>
            <input type="number" id="l_s" value="482">
            <label>Años de Servicio:</label>
            <input type="number" id="l_a" value="1">
            <button class="btn" onclick="calcLiq()">Calcular Liquidación</button>
            <div id="r_l" class="res"></div>
        </div>
    </div>

    <div id="dec" class="section">
        <h3>Décimo Tercero y Cuarto</h3>
        <div class="card">
            <label>Sueldo Mensual Promedio ($):</label>
            <input type="number" id="d_s" value="482">
            <label>Meses Trabajados (1 a 12):</label>
            <input type="number" id="d_m" value="12" min="1" max="12">
            <button class="btn" onclick="calcDec()">Calcular Proporcionales</button>
            <div id="r_d" class="res"></div>
        </div>
    </div>

    <div id="jub" class="section">
        <h3>Jubilación Patronal (Art. 216)</h3>
        <div class="card">
            <label>Promedio Sueldo Mensual (últimos 5 años):</label>
            <input type="number" id="j_p" value="800">
            <label>Años de Servicio (mínimo 25):</label>
            <input type="number" id="j_a" value="25" min="25">
            <label>Edad al Jubilarse:</label>
            <input type="number" id="j_e" value="60">
            <button class="btn" style="background: var(--s);" onclick="calcJub()">Calcular Pensión Mensual</button>
            <div id="r_j" class="res"></div>
        </div>
    </div>

    <div id="extras" class="section">
        <h3>Horas Suplementarias y Extraordinarias</h3>
        <div class="card">
            <label>Sueldo Mensual ($):</label>
            <input type="number" id="h_s" value="482">
            <label>Horas al 50%:</label>
            <input type="number" id="h_50" value="0">
            <label>Horas al 100%:</label>
            <input type="number" id="h_100" value="0">
            <button class="btn" onclick="calcExtras()">Calcular Recargos</button>
            <div id="r_h" class="res"></div>
        </div>
    </div>
</div>

<section class="info-container">
    <div class="info-column">
        <h3>Actualidad Laboral 🇪🇨</h3>
        <ul class="news-list">
            <li><span class="date">05 Feb 2026</span><a href="#">Guía para el pago de feriado de Carnaval 2026.</a></li>
