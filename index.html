<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LABORALEC | CALCULADORA INTEGRAL 2026</title>
    <style>
        :root { --p: #0f172a; --s: #10b981; --i: #3b82f6; --g: #64748b; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f1f5f9; margin: 0; padding: 20px; position: relative; }
        
        /* Marca de Agua */
        body::before {
            content: "LABORALEC"; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: 8rem; font-weight: 900; color: rgba(0, 0, 0, 0.03);
            z-index: -1; pointer-events: none;
        }

        .container { max-width: 1100px; margin: auto; }
        header { background: var(--p); color: white; padding: 25px; border-radius: 12px; text-align: center; margin-bottom: 25px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; border-top: 6px solid; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        h2 { font-size: 1.1rem; color: var(--p); margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--g); margin: 10px 0 5px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; border: 1.5px solid #cbd5e0; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; color: white; font-weight: 700; cursor: pointer; background: var(--p); margin-top: 15px; transition: 0.3s; }
        button:hover { background: #1e293b; }

        .res { margin-top: 15px; padding: 15px; border-radius: 8px; display: none; font-size: 1rem; font-weight: 700; line-height: 1.6; }
        .ok { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; display: block; }
        .err { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; display: block; }

        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>LABORALEC | SISTEMA LEGAL 2026</h1>
        <p>SBU Vigente: $482.00 | Cálculos de Décimos y Jubilación Corregidos</p>
    </header>

    <div class="grid">
        <div class="card" style="border-top-color: var(--i);">
            <h2>1. Décimos (13ro y 14to)</h2>
            <label>Sueldo Mensual del Periodo:</label>
            <input type="text" id="d_sue" placeholder="Ej: 561">
            <label>Meses Trabajados (1-12):</label>
            <input type="text" id="d_mes" placeholder="Ej: 12">
            <button onclick="calcular('d')">Calcular Beneficios</button>
            <div id="out_d" class="res"></div>
        </div>

        <div class="card" style="border-top-color: var(--s);">
            <h2>2. Jubilación Patronal</h2>
            <label>Promedio Sueldo (últimos 5 años):</label>
            <input type="text" id="j_prom" placeholder="Ej: 800">
            <label>Años de Servicio:</label>
            <input type="text" id="j_ani" placeholder="Mínimo 25">
            <label>Coeficiente Edad (IESS):</label>
            <input type="text" id="j_coef" placeholder="Ej: 6.2305">
            <button onclick="calcular('j')">Calcular Pensión</button>
            <div id="out_j" class="res"></div>
        </div>

        <div class="card" style="border-top-color: var(--g);">
            <h2>3. Indemnización LOSEP</h2>
            <label>Último Sueldo Percibido:</label>
            <input type="text" id="l_sue" placeholder="Ej: 1200">
            <label>Años en Sector Público:</label>
            <input type="text" id="l_ani" placeholder="Ej: 15">
            <button onclick="calcular('l')">Calcular LOSEP</button>
            <div id="out_l" class="res"></div>
        </div>
    </div>

    <div style="text-align:center; margin-top:30px;">
        <button class="no-print" onclick="window.print()" style="width:auto; background:white; color:var(--p); border:2px solid var(--p); padding:10px 30px;">🖨️ Generar Reporte PDF</button>
    </div>
</div>

<script>
    const SBU = 482.00;

    function v(id) {
        let val = document.getElementById(id).value.trim().replace(',', '.');
        if (val === "" || isNaN(val) || parseFloat(val) < 0) return null;
        return parseFloat(val);
    }

    function res(id, m, e = false) {
        const target = document.getElementById('out_' + id);
        target.innerHTML = m;
        target.className = 'res ' + (e ? 'err' : 'ok');
    }

    function calcular(t) {
        if (t === 'd') {
            let sueldo = v('d_sue'), meses = v('d_mes');
            if (sueldo === null || meses === null) return res('d', '⚠️ Use números válidos.', true);
            
            // Si pones 561 y 12 meses, debe dar 561.
            let d13 = (sueldo * meses) / 12;
            let d14 = (SBU / 12) * meses;
            
            res('d', `Décimo Tercero: $${d13.toFixed(2)}<br>Décimo Cuarto: $${d14.toFixed(2)}`);
        }
        
        if (t === 'j') {
            let p = v('j_prom'), a = v('j_ani'), c = v('j_coef');
            if (p === null || a === null || c === null) return res('j', '⚠️ Datos incompletos.', true);
            
            // Fórmula: ((Promedio * 5%) * Años) / Coeficiente / 12 meses
            let haberIndividual = (p * 0.05) * a;
            let mensual = (haberIndividual / c) / 12;
            
            res('j', `Pensión Mensual: $${mensual.toFixed(2)}<br><small>Haber Individual: $${haberIndividual.toFixed(2)}</small>`);
        }

        if (t === 'l') {
            let s = v('l_sue'), a = v('l_ani');
            if (s === null || a === null) return res('l', '⚠️ Sueldo y años requeridos.', true);
            
            let total = (SBU * 5) * a;
            let tope = SBU * 150;
            if (total > tope) total = tope;
            
            res('l', `Monto LOSEP: $${total.toFixed(2)}`);
        }
    }
</script>
</body>
</html>
