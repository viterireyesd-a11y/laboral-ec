<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboral-EC | Sistema Certificado 2026</title>
    <style>
        :root { --p: #0f172a; --s: #10b981; --i: #3b82f6; --w: #f59e0b; --d: #ef4444; --g: #64748b; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; margin: 0; padding: 20px; position: relative; }
        
        /* Marca de Agua */
        body::before {
            content: "LABORALEC"; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: 8rem; font-weight: 900; color: rgba(0, 0, 0, 0.03);
            z-index: -1; pointer-events: none;
        }

        .container { max-width: 1200px; margin: auto; }
        header { background: var(--p); color: white; padding: 25px; border-radius: 12px; text-align: center; margin-bottom: 25px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; border-top: 6px solid; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        h2 { font-size: 1rem; color: var(--p); margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--g); margin: 10px 0 5px; }
        input { width: 100%; padding: 10px; border: 1.5px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; }
        
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; color: white; font-weight: 700; cursor: pointer; background: var(--p); margin-top: 10px; }
        
        .res { margin-top: 15px; padding: 12px; border-radius: 8px; display: none; font-size: 0.9rem; font-weight: 700; line-height: 1.5; }
        .ok { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; display: block; }
        .err { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; display: block; }

        @media print { .no-print { display: none !important; } body::before { color: rgba(0,0,0,0.05) !important; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>LABORALEC | CALCULADORA INTEGRAL 2026</h1>
        <p>SBU Vigente: $482.00 | Fórmulas de Jubilación y LOSEP Corregidas</p>
    </header>

    <div class="grid">
        <div class="card" style="border-top-color: var(--i);">
            <h2>1. Décimos (13ro y 14to)</h2>
            <label>Ingresos Anuales Totales (Suma de sueldos):</label>
            <input type="text" id="d1" placeholder="Ej: 5784">
            <label>Meses Trabajados (1-12):</label>
            <input type="text" id="d2" placeholder="Ej: 12">
            <button onclick="f('d')">Calcular Décimos</button>
            <div id="out_d" class="res"></div>
        </div>

        <div class="card" style="border-top-color: var(--s);">
            <h2>2. Jubilación Patronal (Art. 216)</h2>
            <label>Promedio Sueldo (últimos 5 años):</label>
            <input type="text" id="j1" placeholder="Ej: 800">
            <label>Años de Servicio Continuo:</label>
            <input type="text" id="j2" placeholder="Mínimo 25">
            <label>Coeficiente Edad (IESS):</label>
            <input type="text" id="j3" placeholder="Ej: 6.2305">
            <button onclick="f('j')">Calcular Pensión</button>
            <div id="out_j" class="res"></div>
        </div>

        <div class="card" style="border-top-color: var(--w);">
            <h2>3. Horas Suplementarias / Extra</h2>
            <label>Sueldo Mensual:</label>
            <input type="text" id="h1" placeholder="Ej: 482">
            <label>Horas 50% (Suplementarias):</label>
            <input type="text" id="h2" placeholder="0">
            <label>Horas 100% (Extraordinarias):</label>
            <input type="text" id="h3" placeholder="0">
            <button onclick="f('h')">Calcular Horas</button>
            <div id="out_h" class="res"></div>
        </div>

        <div class="card" style="border-top-color: var(--d);">
            <h2>4. Despido Intempestivo</h2>
            <label>Última Remuneración:</label>
            <input type="text" id="i1" placeholder="Ej: 800">
            <label>Años de Trabajo:</label>
            <input type="text" id="i2" placeholder="Ej: 5">
            <button onclick="f('i')">Calcular Despido</button>
            <div id="out_i" class="res"></div>
        </div>

        <div class="card" style="border-top-color: #8b5cf6;">
            <h2>5. Desahucio (Art. 185)</h2>
            <label>Última Remuneración:</label>
            <input type="text" id="ds1">
            <label>Años Cumplidos:</label>
            <input type="text" id="ds2">
            <button onclick="f('ds')">Calcular Desahucio</button>
            <div id="out_ds" class="res"></div>
        </div>

        <div class="card" style="border-top-color: var(--g);">
            <h2>6. Indemnización LOSEP</h2>
            <label>Último Sueldo Percibido:</label>
            <input type="text" id="l1" placeholder="Ej: 1200">
            <label>Años en Sector Público:</label>
            <input type="text" id="l2" placeholder="Ej: 10">
            <button onclick="f('l')">Calcular LOSEP</button>
            <div id="out_l" class="res"></div>
        </div>
    </div>
    
    <button class="no-print" onclick="window.print()" style="margin-top:25px; background:white; color:var(--p); border:2px solid var(--p); width:auto; padding:12px 30px; font-weight:bold;">🖨️ Generar Reporte PDF</button>
</div>

<script>
    const SBU = 482.00;

    function v(id) {
        let val = document.getElementById(id).value.trim().replace(',', '.');
        if (val === "" || isNaN(val) || parseFloat(val) < 0) return null;
        return parseFloat(val);
    }

    function res(id, m, e = false) {
        const target = document.getElementById('out_' + id);
        target.innerHTML = m;
        target.className = 'res ' + (e ? 'err' : 'ok');
    }

    function f(t) {
        if (t === 'd') {
            let i = v('d1'), m = v('d2');
            if (i === null || m === null) return res('d', '⚠️ Use números válidos.', true);
            let d13 = i / 12;
            let d14 = (SBU / 12) * m;
            res('d', `Décimo 3ro: $${d13.toFixed(2)}<br>Décimo 4to: $${d14.toFixed(2)}`);
        }
        
        if (t === 'j') {
            let p = v('j1'), a = v('j2'), c = v('j3');
            if (p === null || a === null || c === null) return res('j', '⚠️ Ingrese todos los datos numéricos.', true);
            // Fórmula corregida: (Promedio * 0.05 * Años) / Coeficiente / 12 meses
            let pensionMensual = ((p * 0.05 * a) / c) / 12;
            res('j', `Pensión Mensual: $${pensionMensual.toFixed(2)}`);
        }

        if (t === 'h') {
            let s = v('h1'), h5 = v('h2')||0, h1 = v('h3')||0;
            if (s === null) return res('h', '⚠️ Sueldo requerido.', true);
            let vh = s / 240;
            res('h', `Total Recargos: $${((vh*1.5*h5)+(vh*2*h1)).toFixed(2)}`);
        }

        if (t === 'i') {
            let r = v('i1'), a = v('i2');
            if (r === null || a === null) return res('i', '⚠️ Revise datos.', true);
            let factor = (a < 3) ? 3 : a;
            res('i', `Monto Art 188: $${(r * factor).toFixed(2)}`);
        }

        if (t === 'ds') {
            let r = v('ds1'), a = v('ds2');
            if (r === null || a === null) return res('ds', '⚠️ Verifique sueldo/años.', true);
            res('ds', `Bonif. 25%: $${(r * 0.25 * a).toFixed(2)}`);
        }

        if (t === 'l') {
            let s = v('l1'), a = v('l2');
            if (s === null || a === null) return res('l', '⚠️ Sueldo y años obligatorios.', true);
            // Tope 150 SBU
            let monto = (SBU * 5 * a);
            let tope = SBU * 150;
            if (monto > tope) monto = tope;
            res('l', `Monto LOSEP: $${monto.toFixed(2)}`);
        }
    }
</script>
</body>
</html>
