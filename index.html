<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laborales.com | Calculadora Oficial 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --primario: #1a5d1a; --secundario: #27ae60; --alerta: #e67e22; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); width: 100%; max-width: 650px; }
        h1 { color: var(--primario); text-align: center; margin-bottom: 5px; }
        .version { text-align: center; font-size: 14px; color: var(--secundario); font-weight: bold; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #333; }
        select, input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-calc { background: var(--secundario); color: white; font-size: 16px; }
        .btn-pdf { background: var(--alerta); color: white; display: none; }
        .result-box { margin-top: 25px; padding: 20px; border: 2px solid var(--secundario); border-radius: 10px; background: #f0fff0; display: none; }
        .hidden { display: none; }
        .highlight { color: #c0392b; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h1>Laborales.com</h1>
    <p class="version">SBU Actualizado 2026: $482.00</p>

    <div class="form-group">
        <label>Régimen Laboral:</label>
        <select id="regimen" onchange="switchRegimen()">
            <option value="codigo">Código del Trabajo</option>
            <option value="losep">LOSEP (Servidor Público)</option>
        </select>
    </div>

    <div id="bloque-codigo">
        <label><input type="checkbox" id="es_despido" onchange="switchContrato()"> ¿Fue Despido Intempestivo?</label>
        <div id="check-contrato" class="hidden" style="margin: 10px 0 0 20px; padding: 10px; background: #eee; border-radius: 5px;">
            <label class="highlight"><input type="checkbox" id="usar_mandato"> Aplicar Indemnización 100 SBU (Contrato 2019)</label>
        </div>
    </div>

    <div id="bloque-losep" class="hidden">
        <label>Situación del Servidor:</label>
        <select id="tipo_losep">
            <option value="nada">Contrato Ocasional / Provisional</option>
            <option value="indem">Nombramiento Permanente (Supresión)</option>
        </select>
    </div>

    <hr style="margin: 20px 0;">

    <div class="form-group">
        <label>Sueldo Mensual ($):</label>
        <input type="number" id="sueldo" placeholder="Ej: 1200">
    </div>

    <div class="form-group">
        <label>Años de Servicio:</label>
        <input type="number" id="anos" placeholder="Ej: 5">
    </div>

    <div class="form-group">
        <label>Horas Extras Suplementarias (50%):</label>
        <input type="number" id="h50" value="0">
    </div>

    <button class="btn btn-calc" onclick="calcularTodo()">CALCULAR LIQUIDACIÓN</button>
    <button class="btn" style="background:#bdc3c7;" onclick="window.location.reload()">RESETEAR SISTEMA</button>

    <div id="result-box" class="result-box">
        <div id="area-pdf">
            <h2 id="total-val" style="text-align:center; color: var(--primario);"></h2>
            <div id="detalle-val"></div>
            <p id="fecha-limite" style="font-weight:bold; color:#c0392b; margin-top:15px;"></p>
        </div>
        <button class="btn btn-pdf" id="btn-pdf" onclick="descargar()">Descargar PDF Oficial</button>
    </div>
</div>

<script>
// VALOR GLOBAL ACTUALIZADO 2026
const SBU_FINAL = 482;

function switchRegimen() {
    const r = document.getElementById('regimen').value;
    document.getElementById('bloque-codigo').classList.toggle('hidden', r !== 'codigo');
    document.getElementById('bloque-losep').classList.toggle('hidden', r !== 'losep');
}

function switchContrato() {
    const d = document.getElementById('es_despido').checked;
    document.getElementById('check-contrato').classList.toggle('hidden', !d);
}

function calcularTodo() {
    const reg = document.getElementById('regimen').value;
    const sueldo = parseFloat(document.getElementById('sueldo').value) || 0;
    const anos = parseInt(document.getElementById('anos').value) || 0;
    const h50 = parseFloat(document.getElementById('h50').value) || 0;

    let total = 0;
    let items = "<ul>";

    if (reg === 'codigo') {
        const despido = document.getElementById('es_despido').checked;
        const contrato = document.getElementById('usar_mandato').checked;

        if (despido) {
            if (contrato) {
                let m = 100 * SBU_FINAL;
                total += m;
                items += `<li><b>Indemnización Contrato 2019 (100 SBU):</b> $${m.toFixed(2)}</li>`;
            } else {
                let m = (anos < 3 ? 3 : (anos > 25 ? 25 : anos)) * sueldo;
                total += m;
                items += `<li><b>Indemnización Despido Art. 188:</b> $${m.toFixed(2)}</li>`;
            }
        }
        let desahucio = (sueldo * 0.25) * anos;
        total += desahucio;
        items += `<li><b>Bonificación Desahucio (25%):</b> $${desahucio.toFixed(2)}</li>`;
    } else {
        const tipo = document.getElementById('tipo_losep').value;
        if (tipo === 'indem') {
            let m = Math.min((5 * SBU_FINAL * anos), (150 * SBU_FINAL));
            total += m;
            items += `<li><b>Indemnización Supresión LOSEP:</b> $${m.toFixed(2)}</li>`;
        }
    }

    // Horas extras
    if(h50 > 0) {
        let p = h50 * ((sueldo / 240) * 1.5);
        total += p;
        items += `<li><b>Horas Suplementarias:</b> $${p.toFixed(2)}</li>`;
    }

    items += "</ul>";
    
    // Fecha límite (15 días)
    const hoy = new Date();
    hoy.setDate(hoy.getDate() + 15);
    const fechaPago = hoy.toLocaleDateString('es-EC');

    document.getElementById('total-val').innerText = `TOTAL A PAGAR: $${total.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
    document.getElementById('detalle-val').innerHTML = items;
    document.getElementById('fecha-limite').innerText = `PLAZO MÁXIMO DE PAGO: ${fechaPago}`;
    document.getElementById('result-box').style.display = 'block';
    document.getElementById('btn-pdf').style.display = 'block';
}

function descargar() {
    const el = document.getElementById('area-pdf');
    html2pdf().from(el).set({
        margin: 1,
        filename: 'Laborales_Liquidacion_2026.pdf',
        jsPDF: { unit: 'in', format: 'letter' }
    }).save();
}
</script>
</body>
</html>
