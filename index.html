<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboral-EC | Sistema Legal 2026</title>
    <style>
        :root { --p: #0f172a; --s: #10b981; --i: #3b82f6; --d: #ef4444; --g: #64748b; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; margin: 0; padding: 20px; position: relative; }
        
        /* Marca de Agua */
        body::before {
            content: "LABORALEC"; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: 8rem; font-weight: 900; color: rgba(0, 0, 0, 0.03);
            z-index: -1; pointer-events: none;
        }

        .container { max-width: 1100px; margin: auto; }
        header { background: var(--p); color: white; padding: 25px; border-radius: 12px; text-align: center; margin-bottom: 25px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; border-top: 5px solid; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--g); margin-bottom: 5px; }
        input { width: 100%; padding: 10px; border: 1.5px solid #cbd5e0; border-radius: 6px; margin-bottom: 12px; box-sizing: border-box; }
        
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; color: white; font-weight: 700; cursor: pointer; background: var(--p); }
        .res { margin-top: 15px; padding: 12px; border-radius: 6px; display: none; font-size: 0.9rem; font-weight: 700; line-height: 1.5; }
        .ok { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; display: block; }
        .err { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; display: block; }

        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>LABORALEC | CALCULADORA LEGAL 2026</h1>
        <p>SBU Vigente: $482.00</p>
    </header>

    <div class="grid">
        <div class="card" style="border-top-color: var(--i);">
            <h2>1. Décimos (13ro y 14to)</h2>
            <label>Ingresos Totales (para D13):</label>
            <input type="text" id="d_ing" placeholder="Ej: 6000">
            <label>Meses Trabajados (para D14):</label>
            <input type="text" id="d_mes" placeholder="1 a 12">
            <button onclick="calc('d')">Calcular Décimos</button>
            <div id="res_d" class="res"></div>
        </div>

        <div class="card" style="border-top-color: var(--s);">
            <h2>2. Jubilación Patronal</h2>
            <label>Promedio últimos 5 años:</label>
            <input type="text" id="j_prom">
            <label>Años de Servicio:</label>
            <input type="text" id="j_ani">
            <label>Coeficiente por Edad (Tabla IESS):</label>
            <input type="text" id="j_coef" placeholder="Ej: 6.20">
            <button onclick="calc('j')">Calcular Pensión</button>
            <div id="res_j" class="res"></div>
        </div>

        <div class="card" style="border-top-color: var(--g);">
            <h2>3. Indemnización LOSEP</h2>
            <label>Último Sueldo:</label>
            <input type="text" id="l_sue">
            <label>Años en Sector Público:</label>
            <input type="text" id="l_ani">
            <button onclick="calc('l')">Calcular LOSEP</button>
            <div id="res_l" class="res"></div>
        </div>
    </div>

    <button class="btn-print no-print" onclick="window.print()" style="margin-top:20px; background:#fff; color:#000; border:1px solid #000; width:auto; padding:10px 20px;">🖨️ Imprimir Reporte</button>
</div>

<script>
    const SBU = 482.00;

    function v(id) {
        let val = document.getElementById(id).value.trim().replace(',', '.');
        return (val === "" || isNaN(val) || parseFloat(val) < 0) ? null : parseFloat(val);
    }

    function out(id, m, e = false) {
        const c = document.getElementById('res_' + id);
        c.innerHTML = m;
        c.className = 'res ' + (e ? 'err' : 'ok');
    }

    function calc(t) {
        if (t === 'd') {
            let i = v('d_ing'), m = v('d_mes');
            if (i === null || m === null) return out('d', '⚠️ Error: Ingrese valores numéricos.', true);
            let d13 = i / 12;
            let d14 = (SBU / 12) * m;
            out('d', `Décimo Tercero: $${d13.toFixed(2)}<br>Décimo Cuarto: $${d14.toFixed(2)}`);
        }
        if (t === 'j') {
            let p = v('j_prom'), a = v('j_ani'), c = v('j_coef');
            if (p === null || a === null || c === null) return out('j', '⚠️ Error en datos de jubilación.', true);
            // Fórmula legal: (Promedio * 0.05 * años) / coeficiente
            let pensionAnual = (p * 0.05 * a) / c;
            let pensionMensual = pensionAnual / 12;
            out('j', `Pensión Mensual Estimada: $${pensionMensual.toFixed(2)}`);
        }
        if (t === 'l') {
            let s = v('l_sue'), a = v('l_ani');
            if (s === null || a === null) return out('l', '⚠️ Ingrese sueldo y años.', true);
            // LOSEP: 5 SBU por cada año, tope 150 SBU o según sueldo/reglamento
            let total = (SBU * 5) * a;
            out('l', `Monto LOSEP: $${total.toFixed(2)}<br><small>Basado en 5 SBU/año.</small>`);
        }
    }
</script>
</body>
</html>
