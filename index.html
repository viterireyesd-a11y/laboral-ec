<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LABORALEC | SISTEMA LEGAL 2026</title>
    <style>
        :root { --p: #0f172a; --s: #10b981; --i: #3b82f6; --w: #f59e0b; --d: #ef4444; --g: #64748b; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f1f5f9; margin: 0; padding: 20px; position: relative; }
        
        body::before {
            content: "LABORALEC"; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: 8rem; font-weight: 900; color: rgba(0, 0, 0, 0.03);
            z-index: -1; pointer-events: none;
        }

        .container { max-width: 1200px; margin: auto; }
        header { background: var(--p); color: white; padding: 25px; border-radius: 12px; text-align: center; margin-bottom: 25px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; border-top: 6px solid; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        h2 { font-size: 1rem; color: var(--p); margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 8px; text-transform: uppercase; }
        label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--g); margin: 10px 0 5px; }
        input { width: 100%; padding: 12px; border: 1.5px solid #cbd5e0; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        
        button { width: 100%; padding: 14px; border: none; border-radius: 8px; color: white; font-weight: 700; cursor: pointer; background: var(--p); margin-top: 15px; font-size: 1rem; }
        button:hover { background: #1e293b; }

        .res { margin-top: 15px; padding: 15px; border-radius: 8px; display: none; font-size: 1rem; font-weight: 700; line-height: 1.6; }
        .ok { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; display: block; }
        .err { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; display: block; }

        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>LABORALEC | CALCULADORA INTEGRAL</h1>
        <p>SBU 2026: $482.00 | Jubilación Patronal Rectificada</p>
    </header>

    <div class="grid">
        <div class="card" style="border-top-color: var(--i);">
            <h2>1. Décimos (13ro y 14to)</h2>
            <label>Sueldo Mensual:</label>
            <input type="text" id="d1" placeholder="Ej: 561">
            <label>Meses Trabajados (1-12):</label>
            <input type="text" id="d2" placeholder="Ej: 12">
            <button onclick="f('d')">Calcular Décimos</button>
            <div id="out_d" class="res"></div>
        </div>

        <div class="card" style="border-top-color: var(--s);">
            <h2>2. Jubilación Patronal (Art. 216)</h2>
            <label>Promedio Sueldo (últimos 5 años):</label>
            <input type="text" id="j1" placeholder="Ej: 800">
            <label>Años de Servicio:</label>
            <input type="text" id="j2" placeholder="Mínimo 25">
            <label>Coeficiente Edad (Tabla IESS):</label>
            <input type="text" id="j3" placeholder="Ej: 6.2305">
            <button onclick="f('j')">Calcular Pensión Mensual</button>
            <div id="out_j" class="res"></div>
        </div>

        <div class="card" style="border-top-color: var(--w);">
            <h2>3. Horas Suplementarias / Extra</h2>
            <label>Sueldo Mensual:</label>
            <input type="text" id="h1" placeholder="Ej: 482">
            <label>Horas 50%:</label>
            <input type="text" id="h2" value="0">
            <label>Horas 100%:</label>
            <input type="text" id="h3" value="0">
            <button onclick="f('h')">Calcular Horas</button>
            <div id="out_h" class="res"></div>
        </div>

        <div class="card" style="border-top-color: var(--d);">
            <h2>4. Despido Intempestivo</h2>
            <label>Última Remuneración:</label>
            <input type="text" id="i1">
            <label>Años de Trabajo:</label>
            <input type="text" id="i2">
            <button onclick="f('i')">Calcular Despido</button>
            <div id="out_i" class="res"></div>
        </div>

        <div class="card" style="border-top-color: #8b5cf6;">
            <h2>5. Desahucio</h2>
            <label>Última Remuneración:</label>
            <input type="text" id="ds1">
            <label>Años Cumplidos:</label>
            <input type="text" id="ds2">
            <button onclick="f('ds')">Calcular Desahucio</button>
            <div id="out_ds" class="res"></div>
        </div>

        <div class="card" style="border-top-color: var(--g);">
            <h2>6. Indemnización LOSEP</h2>
            <label>Años en Sector Público:</label>
            <input type="text" id="l1">
            <button onclick="f('l')">Calcular LOSEP</button>
            <div id="out_l" class="res"></div>
        </div>
    </div>
</div>

<script>
    const SBU = 482.00;

    function v(id) {
        let val = document.getElementById(id).value.trim().replace(',', '.');
        if (val === "" || isNaN(val) || parseFloat(val) < 0) return null;
        return parseFloat(val);
    }

    function res(id, m, e = false) {
        const target = document.getElementById('out_' + id);
        target.innerHTML = m;
        target.className = 'res ' + (e ? 'err' : 'ok');
    }

    function f(t) {
        // DÉCIMOS
        if (t === 'd') {
            let s = v('d1'), m = v('d2');
            if (s === null || m === null) return res('d', '⚠️ Use números válidos.', true);
            let d13 = (s * m) / 12; 
            let d14 = (SBU / 12) * m;
            res('d', `Décimo 3ro: $${d13.toFixed(2)}<br>Décimo 4to: $${d14.toFixed(2)}`);
        }
        
        // JUBILACIÓN PATRONAL (RECTIFICADA)
        if (t === 'j') {
            let p = v('j1'), a = v('j2'), c = v('j3');
            if (p === null || a === null || c === null) return res('j', '⚠️ Datos incompletos.', true);
            
            // FÓRMULA PASO A PASO
            let fondoHaber = (p * 0.05) * a;
            let pensionAnual = fondoHaber / c;
            let pensionMensual = pensionAnual / 12;
            
            res('j', `Pensión Mensual: $${pensionMensual.toFixed(2)}<br><small>Haber Individual: $${fondoHaber.toFixed(2)}</small>`);
        }

        // HORAS EXTRAS
        if (t === 'h') {
            let s = v('h1'), h5 = v('h2')||0, h1 = v('h3')||0;
            if (s === null) return res('h', '⚠️ Sueldo requerido.', true);
            let vh = s / 240;
            res('h', `Total Recargos: $${((vh*1.5*h5)+(vh*2*h1)).toFixed(2)}`);
        }

        // DESPIDO
        if (t === 'i') {
            let r = v('i1'), a = v('i2');
            if (r === null || a === null) return res('i', '⚠️ Revise datos.', true);
            let factor = (a < 3) ? 3 : a;
            res('i', `Indemnización: $${(r * factor).toFixed(2)}`);
        }

        // DESAHUCIO
        if (t === 'ds') {
            let r = v('ds1'), a = v('ds2');
            if (r === null || a === null) return res('ds', '⚠️ Revise datos.', true);
            res('ds', `Bonif. 25%: $${(r * 0.25 * a).toFixed(2)}`);
        }

        // LOSEP
        if (t === 'l') {
            let a = v('l1');
            if (a === null) return res('l', '⚠️ Años requeridos.', true);
            let total = (SBU * 5 * a);
            let tope = SBU * 150;
            res('l', `Monto LOSEP: $${(total > tope ? tope : total).toFixed(2)}`);
        }
    }
</script>
</body>
</html>
